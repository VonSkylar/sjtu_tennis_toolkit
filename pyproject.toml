[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sjtu-tennis-toolkit"
dynamic = ["version"]
description = "交我办网球场监控与抢场工具集 — SJTU Tennis Toolkit"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "playwright>=1.44,<2",
    "Pillow>=10,<12",
]

[project.scripts]
sjtu-tennis = "sjtu_tennis_toolkit.__main__:main"

[tool.setuptools.dynamic]
# 版本号单一来源：sjtu_tennis_toolkit/__init__.py 的 __version__
version = {attr = "sjtu_tennis_toolkit.__version__"}

[tool.setuptools.packages.find]
include = ["sjtu_tennis_toolkit*"]
